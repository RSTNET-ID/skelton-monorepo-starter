# Only application processes run here. MySQL and Redis are EXTERNAL.
# Use: docker compose --env-file .env -f docker-compose.yml config
x-runtime: &runtime
  APP_ENV: ${APP_ENV:-development}
  TZ: ${TZ:-UTC}
  SERVICE_NAME: ${SERVICE_NAME:-monorepo-starter}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_DRIVER: mysql
  DATABASE_URL: ${DATABASE_URL:?Set an external MySQL DATABASE_URL in .env}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_IDLE_TIMEOUT_SECONDS: ${DB_IDLE_TIMEOUT_SECONDS:-30}
  DB_CONNECTION_TIMEOUT_SECONDS: ${DB_CONNECTION_TIMEOUT_SECONDS:-10}
  DB_MAX_LIFETIME_SECONDS: ${DB_MAX_LIFETIME_SECONDS:-0}
  DB_PREPARE: ${DB_PREPARE:-true}
  DB_TLS_MODE: ${DB_TLS_MODE:-disable}
  DB_ALLOW_PUBLIC_KEY_RETRIEVAL: ${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:-false}
  REDIS_URL: ${REDIS_URL:?Set an external Redis REDIS_URL in .env}
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:-monorepo-starter:development}
  REDIS_CONNECTION_TIMEOUT_MS: ${REDIS_CONNECTION_TIMEOUT_MS:-5000}
  REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES:-20}
  WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-default}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  WORKER_BLOCK_MS: ${WORKER_BLOCK_MS:-1000}
  WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-30000}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
  WORKER_RETRY_BACKOFF_MS: ${WORKER_RETRY_BACKOFF_MS:-1000}
  WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-60000}
  WORKER_RECLAIM_INTERVAL_MS: ${WORKER_RECLAIM_INTERVAL_MS:-15000}
  SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_HOST: ${METRICS_HOST:-127.0.0.1}
  METRICS_PORT: ${METRICS_PORT:-9464}
  PROCESS_HEALTH_PORT: ${PROCESS_HEALTH_PORT:-9465}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  SERVER_IDLE_TIMEOUT_SECONDS: ${SERVER_IDLE_TIMEOUT_SECONDS:-15}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
  SHUTDOWN_DRAIN_DELAY_MS: ${SHUTDOWN_DRAIN_DELAY_MS:-1000}
  OUTBOUND_HTTP_TIMEOUT_MS: ${OUTBOUND_HTTP_TIMEOUT_MS:-5000}
  OUTBOUND_HTTP_MAX_RETRIES: ${OUTBOUND_HTTP_MAX_RETRIES:-2}
  OUTBOUND_HTTP_RETRY_BASE_MS: ${OUTBOUND_HTTP_RETRY_BASE_MS:-100}
  EXAMPLE_ROUTES_ENABLED: ${EXAMPLE_ROUTES_ENABLED:-false}

x-app-image: &app-image
  image: ${REGISTRY_IMAGE:-skelton-monorepo-starter}:${IMAGE_TAG:-local}

services:
  app:
    <<: *app-image
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PUBLISHED_PORT:-3000}:3000"
    environment:
      <<: *runtime
      PORT: "3000"
      API_INTERNAL_PORT: "3001"
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      AUTO_SEED: ${AUTO_SEED:-false}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL in .env}}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-10000}
      PUBLIC_API_BASE_URL: "/api"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    pids_limit: ${APP_PIDS_LIMIT:-256}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app-image
    profiles: ["worker"]
    restart: unless-stopped
    command: ["/app/api/worker"]
    environment:
      <<: *runtime
      WORKER_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    cpus: ${WORKER_CPU_LIMIT:-0.5}

  scheduler:
    <<: *app-image
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["/app/api/scheduler"]
    environment:
      <<: *runtime
      SCHEDULER_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: ${SCHEDULER_PIDS_LIMIT:-128}
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.5}
