services:
  frontend:
    build:
      context: .
    ports:
      - '3001:3000'
    environment:
      API_BASE_URL: http://host.docker.internal:3000/api
      API_TIMEOUT_MS: '10000'
      PUBLIC_API_BASE_URL: /api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
